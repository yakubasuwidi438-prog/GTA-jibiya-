<!DOCTYPE html>
<html lang="ha">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GTA Jibiya Game</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#111;
  color:white;
  font-family:Arial;
  text-align:center;
  overflow:hidden;
}
h1{color:#ffd000;margin:10px}

#game{
  position:relative;
  width:100%;
  height:70vh;
  max-width:500px;
  margin:auto;
  background:#555;
  overflow:hidden;
  border:3px solid #ffd000;
}

.road{
  position:absolute;
  left:15%;
  width:70%;
  height:100%;
  background:#333;
}

.line{
  position:absolute;
  left:49%;
  width:2%;
  height:80px;
  background:#fff;
}

#car{
  position:absolute;
  bottom:30px;
  left:45%;
  width:55px;
  height:90px;
  background:red;
  border-radius:12px;
  border:4px solid white;
}

#target{
  position:absolute;
  top:40px;
  left:45%;
  font-size:40px;
}

#info{
  font-size:18px;
  margin:8px;
  color:#ffd000;
}

.controls{
  display:flex;
  justify-content:center;
  gap:15px;
  margin-top:12px;
}

button{
  width:75px;
  height:60px;
  font-size:25px;
  border:0;
  border-radius:12px;
  background:#ffd000;
  font-weight:bold;
}
</style>
</head>

<body>

<h1>🚗 GTA JIBIYA</h1>

<div id="info">
  🎯 Mission: Ka kai wurin target! |
  ⭐ Points: <span id="score">0</span>
</div>

<div id="game">

  <div class="road"></div>

  <div class="line" style="top:0"></div>
  <div class="line" style="top:160px"></div>
  <div class="line" style="top:320px"></div>
  <div class="line" style="top:480px"></div>

  <div id="target">🎯</div>

  <div id="car"></div>

</div>

<div class="controls">
  <button id="left">⬅️</button>
  <button id="gas">⬆️</button>
  <button id="right">➡️</button>
</div>

<p>Riƙe ⬅️ ➡️ domin juya mota. Riƙe ⬆️ domin gudu.</p>

<script>
const car = document.getElementById("car");
const target = document.getElementById("target");
const scoreText = document.getElementById("score");

let x = 45;
let y = 30;
let score = 0;

let left = false;
let right = false;
let gas = false;

document.getElementById("left").ontouchstart=()=>left=true;
document.getElementById("left").ontouchend=()=>left=false;

document.getElementById("right").ontouchstart=()=>right=true;
document.getElementById("right").ontouchend=()=>right=false;

document.getElementById("gas").ontouchstart=()=>gas=true;
document.getElementById("gas").ontouchend=()=>gas=false;

document.getElementById("left").onmousedown=()=>left=true;
document.getElementById("left").onmouseup=()=>left=false;

document.getElementById("right").onmousedown=()=>right=true;
document.getElementById("right").onmouseup=()=>right=false;

document.getElementById("gas").onmousedown=()=>gas=true;
document.getElementById("gas").onmouseup=()=>gas=false;

function gameLoop(){

  if(left) x -= 0.7;
  if(right) x += 0.7;

  if(gas) y += 1.5;

  if(x < 16) x=16;
  if(x > 78) x=78;

  car.style.left=x+"%";

  let targetTop = parseFloat(target.style.top || 40);

  targetTop += gas ? 3 : 1;

  if(targetTop > 500){
    targetTop = 40;
    target.style.left=(20+Math.random()*55)+"%";
  }

  target.style.top=targetTop+"px";

  let carX=car.offsetLeft;
  let targetX=target.offsetLeft;

  if(
    Math.abs(carX-targetX)<55 &&
    targetTop>480
  ){
    score++;
    scoreText.textContent=score;

    targetTop=40;
    target.style.left=(20+Math.random()*55)+"%";

    alert("🎉 Mission Complete! +1 Point");
  }

  requestAnimationFrame(gameLoop);
}

gameLoop();
</script>

</body>
</html>
